<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Alvares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <div>
                <span class="nomeLogo">Hotel</span>
                <span class="abaixoNome">Alvares</span>
            </div>
        </div>

        <button class="hamburguer" id="hamburguer" aria-label="Abrir menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="navLinks" id="navLinks">
            <li><a href="#">Sobre nós</a></li>
            <li><a href="#">Contacte-nos</a></li>
            <li><a href="#" class="btnNav">Reserve já</a></li>
        </ul>
    </nav>

    <section class="topo">
        <img src="img/capa.jpg" alt="foto hotel" class="imgTopo">
        <div class="fundoEscuro"></div>
        <div class="topoContent">
            <h1 class="tituloTopo">Hotel a Beira Mar no Algarve </h1>
            <p class="descricaoTopo">Venha se hospedar conosco e desfrutar das melhores instalaçôes que você pode encontrar por aqui !</p>
            <a href="#" class="btnTopo">Reserve já</a>
        </div>
        <div class="reservaCard">
            <h3>Reserve a sua estadia</h3>
            <label>Check-in</label>
            <input type="date" id="checkin">
            <label>Check-out</label>
            <input type="date" id="checkout">
            <label>Hóspedes</label>
            <select>
                <option>1 hóspede</option>
                <option>2 hóspedes</option>
                <option>3 hóspedes</option>
            </select>
            <button id="btnVerificar">Verificar disponibilidade</button>
        </div>
    </section>

    <section class="quartos">
        <h2>Os nossos quartos</h2>
        <div id="listaQuartos"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
